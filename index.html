<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Finanças Mês a Mês — Planejamento & Férias</title>
<meta name="theme-color" content="#0D6B56">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanças">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
:root {
  --bg: #F2F5F4;
  --surface: #FFFFFF;
  --surface-alt: #F8FAF9;
  --fg: #15201D;
  --muted: #58675F;
  --line: #DAE3DF;
  --accent: #0D6B56;
  --accent-fg: #FFFFFF;
  --accent-soft: #E1EFEA;
  --pos: #13765A;
  --neg: #B3261E;
  --neg-soft: #FBE8E5;
  --warn: #7F4E00;
  --warn-soft: #FFF0D2;
  --info-soft: #E6EEF8;
  --info: #234E85;
  --series-a: #0D6B56;
  --series-b: #C26A00;
  --font-display: 'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1412; --surface: #151F1D; --surface-alt: #1A2724; --fg: #E7F0ED; --muted: #94A7A1; --line: #25332F;
    --accent: #55C7A4; --accent-fg: #07211A; --accent-soft: #163029;
    --pos: #62D2AC; --neg: #FF9A90; --neg-soft: #3A1E1C;
    --warn: #F2BD62; --warn-soft: #35280F; --info-soft: #172640; --info: #A9C6F2;
    --series-a: #55C7A4; --series-b: #F0A64A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1412; --surface: #151F1D; --surface-alt: #1A2724; --fg: #E7F0ED; --muted: #94A7A1; --line: #25332F;
  --accent: #55C7A4; --accent-fg: #07211A; --accent-soft: #163029;
  --pos: #62D2AC; --neg: #FF9A90; --neg-soft: #3A1E1C;
  --warn: #F2BD62; --warn-soft: #35280F; --info-soft: #172640; --info: #A9C6F2;
  --series-a: #55C7A4; --series-b: #F0A64A;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  padding-block: 0 3.5rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--bg);
}
.wrap { max-width: 720px; margin-inline: auto; }
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); padding-block: 0.75rem 0.5rem;
  border-bottom: 1px solid transparent;
}
.top-row { display: flex; justify-content: space-between; align-items: center; gap: 0.75rem; margin-bottom: 0.6rem; flex-wrap: wrap; }
h1 { font-family: var(--font-display); font-size: 1.15rem; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
.top-actions { display: flex; align-items: center; gap: 0.45rem; }
.stamp { font-size: 0.75rem; color: var(--muted); }
.icon-btn {
  display: inline-flex; align-items: center; gap: 0.35rem;
  padding: 0.35rem 0.65rem; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface); color: var(--fg); font: 500 0.78rem var(--font-body);
  cursor: pointer; transition: background 0.15s, border-color 0.15s;
}
.icon-btn:hover { background: var(--accent-soft); border-color: var(--accent); }
.icon-btn.danger:hover { background: var(--neg-soft); border-color: var(--neg); color: var(--neg); }

.months { display: flex; gap: 0.45rem; overflow-x: auto; scrollbar-width: none; padding-bottom: 0.25rem; }
.months::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto; display: inline-flex; align-items: center; gap: 0.4rem;
  padding: 0.48rem 0.8rem; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); color: var(--fg); font: 600 0.84rem var(--font-body); cursor: pointer;
}
.chip[aria-current="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--neg); }
.chip .dot-vac { width: 7px; height: 7px; border-radius: 50%; background: var(--series-b); }
.chip[aria-current="true"] .dot, .chip[aria-current="true"] .dot-vac { background: var(--accent-fg); }
.chip:focus-visible, input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

main { display: flex; flex-direction: column; gap: 1rem; padding-top: 0.5rem; }
.hero, .card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 1.05rem;
}
.eyebrow { margin: 0; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.big { margin: 0.25rem 0 0; font-family: var(--font-display); font-weight: 700; font-size: 2.25rem; line-height: 1.1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.big.pos { color: var(--pos); } .big.neg { color: var(--neg); }
.big-label { margin: 0.15rem 0 0.9rem; color: var(--muted); font-size: 0.85rem; }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem 1rem; margin: 0; padding-top: 0.9rem; border-top: 1px solid var(--line); }
@media (min-width: 520px) { .stats { grid-template-columns: repeat(4, 1fr); } }
.stat { min-width: 0; }
.stat dt { font-size: 0.74rem; color: var(--muted); }
.stat dd { margin: 0.12rem 0 0; font-family: var(--font-display); font-weight: 600; font-size: 1.02rem; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stat dd.neg { color: var(--neg); }
.stat dd.pos { color: var(--pos); }

.alerts { display: flex; flex-direction: column; gap: 0.5rem; margin: 0; padding: 0; list-style: none; }
.alert { border-radius: 12px; padding: 0.72rem 0.9rem; font-size: 0.87rem; }
.alert b { font-weight: 600; }
.alert.neg { background: var(--neg-soft); color: var(--neg); }
.alert.warn { background: var(--warn-soft); color: var(--warn); }
.alert.info { background: var(--info-soft); color: var(--info); }
.alert.pos { background: var(--accent-soft); color: var(--pos); }

.card-head { display: flex; justify-content: space-between; align-items: center; gap: 0.75rem; margin-bottom: 0.65rem; flex-wrap: wrap; }
h2 { font-family: var(--font-display); font-size: 1.02rem; font-weight: 600; margin: 0; }
.sub { font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; margin-bottom: 0.45rem; }
.bar span { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
@media (prefers-reduced-motion: no-preference) { .bar span { transition: width 0.25s ease; } }

/* Filtros & Badges */
.filters { display: flex; gap: 0.35rem; flex-wrap: wrap; margin-bottom: 0.55rem; }
.f-btn {
  padding: 0.25rem 0.6rem; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface-alt); color: var(--muted); font: 500 0.75rem var(--font-body); cursor: pointer;
}
.f-btn.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); font-weight: 600; }
.badge {
  display: inline-block; padding: 0.1rem 0.42rem; border-radius: 6px; font-size: 0.68rem; font-weight: 600;
  background: var(--surface-alt); color: var(--muted); border: 1px solid var(--line); margin-left: 0.4rem; vertical-align: middle;
}
.badge.pontual { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.badge.divida { background: var(--neg-soft); color: var(--neg); border-color: transparent; }

.list { list-style: none; margin: 0.35rem 0 0; padding: 0; }
.row { display: flex; align-items: center; gap: 0.5rem; border-top: 1px solid var(--line); padding: 0.55rem 0; }
.row:first-child { border-top: 0; }
.row label { display: flex; align-items: center; gap: 0.65rem; flex: 1 1 auto; min-width: 0; cursor: pointer; border-radius: 8px; }
.row input[type="checkbox"] { width: 1.25rem; height: 1.25rem; flex: 0 0 auto; accent-color: var(--accent); margin: 0; }
.row .name { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; font-size: 0.92rem; }
.row .name small { display: block; color: var(--muted); font-size: 0.76rem; margin-top: 0.1rem; }
.row .val { flex: 0 0 auto; font-family: var(--font-display); font-weight: 600; font-variant-numeric: tabular-nums; font-size: 0.94rem; }
.row.done .name, .row.done .val { color: var(--muted); text-decoration: line-through; }
.del-btn {
  background: transparent; border: none; color: var(--muted); cursor: pointer; padding: 0.25rem 0.4rem;
  border-radius: 6px; font-size: 0.85rem; line-height: 1; flex: 0 0 auto;
}
.del-btn:hover { background: var(--neg-soft); color: var(--neg); }

.plain { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 0.55rem 0; border-top: 1px solid var(--line); font-size: 0.92rem; }
.plain:first-of-type { border-top: 0; }
.plain span:first-child { min-width: 0; overflow-wrap: anywhere; }
.plain span:last-child { font-family: var(--font-display); font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }

/* Formulários inline */
.add-form {
  display: grid; grid-template-columns: 1fr 115px auto; gap: 0.45rem;
  margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px dashed var(--line);
}
.add-form.saidas-grid { grid-template-columns: 1fr 105px 105px auto; }
@media (max-width: 520px) {
  .add-form, .add-form.saidas-grid { grid-template-columns: 1fr 1fr; }
  .add-form input[type="text"] { grid-column: 1 / -1; }
  .add-form button { grid-column: 1 / -1; }
}
.inp {
  width: 100%; padding: 0.48rem 0.65rem; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface-alt); color: var(--fg); font: 400 0.85rem var(--font-body);
}
.btn-primary {
  padding: 0.48rem 0.85rem; border-radius: 8px; border: none;
  background: var(--accent); color: var(--accent-fg); font: 600 0.83rem var(--font-body); cursor: pointer;
}
.btn-primary:hover { opacity: 0.92; }

/* Painel Salário 2x2 & Férias */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 0.75rem; }
@media (max-width: 520px) { .grid-2 { grid-template-columns: 1fr; } }
.box-info {
  background: var(--surface-alt); border: 1px solid var(--line); border-radius: 10px; padding: 0.75rem 0.85rem;
}
.box-info h3 { margin: 0 0 0.45rem; font-family: var(--font-display); font-size: 0.88rem; font-weight: 600; color: var(--accent); }
.mini-row { display: flex; justify-content: space-between; gap: 0.5rem; font-size: 0.82rem; padding: 0.22rem 0; border-bottom: 1px solid var(--line); }
.mini-row:last-child { border-bottom: 0; }
.mini-row span:last-child { font-family: var(--font-display); font-weight: 600; font-variant-numeric: tabular-nums; }
.mini-row.total { font-weight: 700; color: var(--pos); padding-top: 0.38rem; margin-top: 0.15rem; border-top: 1px solid var(--line); border-bottom: 0; }
.sim-controls {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.55rem;
  background: var(--surface-alt); border: 1px solid var(--line); border-radius: 10px; padding: 0.75rem; margin-bottom: 0.75rem;
}
@media (max-width: 560px) { .sim-controls { grid-template-columns: 1fr 1fr; } }
.field label { display: block; font-size: 0.72rem; color: var(--muted); margin-bottom: 0.2rem; font-weight: 500; }

/* Gráfico */
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font: 500 10px var(--font-body); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .zero { stroke: var(--muted); stroke-width: 1; }
.chart .a { stroke: var(--series-a); fill: none; stroke-width: 2.25; stroke-linejoin: round; stroke-linecap: round; }
.chart .b { stroke: var(--series-b); fill: none; stroke-width: 2.25; stroke-linejoin: round; stroke-linecap: round; }
.chart .pa { fill: var(--series-a); stroke: var(--surface); stroke-width: 2; }
.chart .pb { fill: var(--series-b); stroke: var(--surface); stroke-width: 2; }
.chart .sel { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
.legend { display: flex; flex-wrap: wrap; gap: 0.4rem 1.2rem; margin-top: 0.5rem; font-size: 0.82rem; }
.legend span { display: inline-flex; align-items: center; gap: 0.4rem; font-variant-numeric: tabular-nums; }
.legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.legend .a i { background: var(--series-a); } .legend .b i { background: var(--series-b); }
.note { margin: 0.6rem 0 0; font-size: 0.78rem; color: var(--muted); }
footer { margin-top: 1.5rem; font-size: 0.78rem; color: var(--muted); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; }
</style>
</head>

  <header class="top">
    <div class="top-row">
      <h1>Finanças mês a mês</h1>
      <div class="top-actions">
        <button type="button" class="icon-btn" id="btn-install" style="display:none;background:var(--accent);color:var(--accent-fg);border-color:var(--accent)" title="Instalar aplicativo no aparelho">📲 Instalar App</button>

<script>
(function () {

  function clone(obj) { return JSON.parse(JSON.stringify(obj)); }
  function loadState() {
    try {
      var saved = localStorage.getItem(STORAGE_KEY);
      if (saved) return JSON.parse(saved);
    } catch (e) {}
    return clone(DEFAULT_DATA);
  }
  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA)); } catch (e) {}
  }
  function loadPaid() {
    try {
      var p = localStorage.getItem(PAID_KEY) || localStorage.getItem('pagos');
      if (p) return JSON.parse(p);
    } catch (e) {}
    return {};
  }
  function savePaid() {
    try { localStorage.setItem(PAID_KEY, JSON.stringify(paid)); } catch (e) {}
  }

  /* ---- Cálculos Trabalhistas: Salário 2x2 Noturno, Consignado em Folha & Férias ---- */
  function calcWorkMetrics(cfg) {
    var base = Number(cfg.salarioBase) || 11285;
    var percNot = (Number(cfg.adicNoturnoPerc) || 30) / 100;
    var diasTrab = Number(cfg.diasTrabalhadosMes) || 15;
    var diasMes = Number(cfg.diasMes) || 30;
    var adicNoturno = 0;

    if (cfg.modoAdicional === 'horas_noturnas') {
      var horasNot = diasTrab * 8;
      adicNoturno = (base / 220) * horasNot * percNot;
    } else {
      adicNoturno = base * (diasTrab / diasMes) * percNot;
    }

    var brutoMensal = base + adicNoturno;
    var inss = Math.min(brutoMensal * 0.14, 988.09);
    var baseIrrf = Math.max(0, brutoMensal - inss);
    var irrf = baseIrrf > 4664.68 ? Math.max(0, baseIrrf * 0.275 - 908.73) : 0;

    var consig = Number(cfg.descontoConsignado) != null ? Number(cfg.descontoConsignado) : 2857.00;
    var extraJan27 = Number(cfg.descontoExtraJan27) != null ? Number(cfg.descontoExtraJan27) : 508.00;
    // Salário líquido informado já com o consignado descontado: R$ 7.300,00 (ou ajustado dinamicamente se o usuário alterar o base/dias)
    var diffSimulacao = (brutoMensal - inss - irrf) - 9601.23;
    var liquidoComConsig = 7300.00 + diffSimulacao - (consig - 2857.00);
    var liquidoAntesConsig = liquidoComConsig + consig;
    var liquidoJan27 = liquidoComConsig - extraJan27;

    // Férias
    var diasGozo = Number(cfg.feriasDiasGozo) || 20;
    var diasVendidos = Number(cfg.feriasDiasVendidos) || 10;
    var feriasBruto = brutoMensal * (diasGozo / 30);
    var tercoFerias = feriasBruto / 3;
    var totalFeriasTrib = feriasBruto + tercoFerias;
    var inssFerias = Math.min(totalFeriasTrib * 0.14, 988.09);
    var irrfFerias = Math.max(0, (totalFeriasTrib - inssFerias) * 0.275 - 908.73);
    var feriasLiquido = totalFeriasTrib - inssFerias - irrfFerias;

    // Abono pecuniário (dias vendidos + 1/3) — isento de INSS e IRRF
    var abonoValor = brutoMensal * (diasVendidos / 30);
    var tercoAbono = abonoValor / 3;
    var abonoLiquido = abonoValor + tercoAbono;
    var totalReceberFerias = feriasLiquido + abonoLiquido;

    // Datas de início, fim do gozo e retorno
    var parts = (cfg.feriasInicio || '2027-03-21').split('-');
    var dtIni = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]), 12, 0, 0);
    var dtFimGozo = new Date(dtIni);
    dtFimGozo.setDate(dtIni.getDate() + diasGozo - 1);
    var dtRetorno = new Date(dtFimGozo);
    dtRetorno.setDate(dtFimGozo.getDate() + 1);

    var diasGozoMesSeguinte = 0;
    for (var d = 0; d < diasGozo; d++) {
      var cur = new Date(dtIni);
      cur.setDate(dtIni.getDate() + d);
      if (cur.getMonth() !== dtIni.getMonth()) diasGozoMesSeguinte++;
    }
    var diasTrabMesRetorno = Math.max(0, 30 - diasGozoMesSeguinte);
    var salarioMesRetornoLiq = (liquidoAntesConsig * (diasTrabMesRetorno / 30)) - consig - extraJan27;

    return {
      base: base,
      adicNoturno: adicNoturno,
      brutoMensal: brutoMensal,
      inss: inss,
      irrf: irrf,
      consig: consig,
      extraJan27: extraJan27,
      liquidoAntesConsig: liquidoAntesConsig,
      liquidoMensal: liquidoComConsig,
      liquidoJan27: liquidoJan27,
      diasGozo: diasGozo,
      diasVendidos: diasVendidos,
      feriasBruto: feriasBruto,
      tercoFerias: tercoFerias,
      totalFeriasTrib: totalFeriasTrib,
      inssFerias: inssFerias,
      irrfFerias: irrfFerias,
      feriasLiquido: feriasLiquido,
      abonoValor: abonoValor,
      tercoAbono: tercoAbono,
      abonoLiquido: abonoLiquido,
      totalReceberFerias: totalReceberFerias,
      dtIni: dtIni,
      dtFimGozo: dtFimGozo,
      dtRetorno: dtRetorno,
      diasGozoMesSeguinte: diasGozoMesSeguinte,
      diasTrabMesRetorno: diasTrabMesRetorno,
      salarioMesRetornoLiq: salarioMesRetornoLiq
    };
  }

  function formatDateBR(dt) {
    var diasSem = ['Domingo', 'Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado'];
    var dd = String(dt.getDate()).padStart(2, '0');
    var mm = String(dt.getMonth() + 1).padStart(2, '0');
    var yyyy = dt.getFullYear();
    return dd + '/' + mm + '/' + yyyy + ' (' + diasSem[dt.getDay()] + ')';
  }

  /* ---- Recálculo Dinâmico de Todos os Meses ---- */
  function recalculateAll() {
    var saldoAnt = Number(DATA.summary.saldoAtual) || 0;
    var reservaAnt = 0;
    var menorSaldo = Infinity;
    var totalAPagar = 0;

    DATA.months.forEach(function (m) {
      m.totEntradas = Number(m.entradas.reduce(function (acc, e) { return acc + (Number(e.valor) || 0); }, 0).toFixed(2));
      m.totSaidas = Number(m.saidas.reduce(function (acc, s) { return acc + (Number(s.valor) || 0); }, 0).toFixed(2));
      m.sobra = Number((m.totEntradas - m.totSaidas).toFixed(2));
      var aporte = Number(m.aporte) || 0;
      m.saldo = Number((saldoAnt + m.sobra - aporte).toFixed(2));
      m.reserva = Number((reservaAnt + aporte).toFixed(2));
      m.total = Number((m.saldo + m.reserva).toFixed(2));
      if (m.saldo < menorSaldo) menorSaldo = m.saldo;
      totalAPagar += m.totSaidas;
      saldoAnt = m.saldo;
      reservaAnt = m.reserva;
    });

    DATA.summary.reservaDez27 = DATA.months[DATA.months.length - 1].reserva;
    DATA.summary.menorSaldo = menorSaldo;
    DATA.summary.totalAPagar = Number(totalAPagar.toFixed(2));
  }

  function applyWorkConfigToMonths() {
    var w = calcWorkMetrics(DATA.workConfig);
    var retKey = w.dtRetorno.getFullYear() + '-' + String(w.dtRetorno.getMonth() + 1).padStart(2, '0');
    var pagasBase = Number(DATA.workConfig.consignadoPagas) || 4;
    var totalParc = Number(DATA.workConfig.consignadoTotal) || 48;

    DATA.months.forEach(function (m, idx) {
      var parcNum = pagasBase + idx; // 2026-11 = 4, 2026-12 = 5, 2027-01 = 6...
      var parcNovo = idx - 1; // 2027-01 = 1/48
      var totalParcNovo = Number(DATA.workConfig.descontoExtraTotalParc) || 48;
      var temConsig = parcNum <= totalParc;
      var temExtraJan = m.key >= '2027-01' && parcNovo <= totalParcNovo;

      m.entradas.forEach(function (e) {
        if (e.nome.indexOf('Salário') === 0) {
          if (m.key === retKey && w.diasGozoMesSeguinte > 0) {
            e.nome = 'Salário ' + w.diasTrabMesRetorno + 'd pós-férias (desc. consig. ' + parcNum + '/' + totalParc + ' + novo ' + parcNovo + '/' + totalParcNovo + ' de R$ ' + w.extraJan27.toFixed(0) + ')';
            e.valor = Number(w.salarioMesRetornoLiq.toFixed(2));
          } else if (temExtraJan) {
            e.nome = 'Salário líquido (desc. consig. ' + parcNum + '/' + totalParc + ' + novo ' + parcNovo + '/' + totalParcNovo + ' de R$ ' + w.extraJan27.toFixed(0) + ')';
            e.valor = Number(w.liquidoJan27.toFixed(2));
          } else {
            e.nome = 'Salário líquido (já desc. consignado ' + parcNum + '/' + totalParc + ' de ' + fmt(w.consig) + ')';
            e.valor = Number(w.liquidoMensal.toFixed(2));
          }
        }
        if (e.nome.indexOf('Férias') === 0) {
          e.nome = 'Férias (' + w.diasGozo + 'd + 1/3) + Abono (' + w.diasVendidos + 'd + 1/3) líq.';
          e.valor = Number(w.totalReceberFerias.toFixed(2));
        }
      });
    });

    recalculateAll();
    saveState();
  }

  recalculateAll();

  /* ---- Helper DOM ---- */
  function h(tag, props) {
    var e = document.createElement(tag);
    if (props) Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (k === 'class') e.className = v;
      else if (k === 'text') e.textContent = v;
      else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
      else if (v === true) e.setAttribute(k, '');
      else if (v !== false && v != null) e.setAttribute(k, v);
    });
    for (var i = 2; i < arguments.length; i++) {
      var kids = [].concat(arguments[i]);

  /* ---- Gráfico SVG ---- */
  var NS = 'http://www.w3.org/2000/svg';
  function s(tag, attrs, text) {
    var e = document.createElementNS(NS, tag);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    if (text != null) e.textContent = text;
    return e;
  }
  function niceStep(range) {
    var raw = Math.max(range, 1000) / 4, pow = Math.pow(10, Math.floor(Math.log10(raw)));
    var c = [1, 2, 5, 10];
    for (var i = 0; i < c.length; i++) if (c[i] * pow >= raw) return c[i] * pow;
    return 10 * pow;
  }
  function tick(v) { return v === 0 ? '0' : (v / 1000).toLocaleString('pt-BR') + ' mil'; }
  function chartCard(m) {
    var months = DATA.months;
    var W = 380, H = 195, pl = 52, pr = 14, pt = 12, pb = 24, n = months.length;
    var all = [];
    months.forEach(function (x) { all.push(x.saldo, x.reserva); });
    var maxV = Math.max.apply(null, all), minV = Math.min(0, Math.min.apply(null, all));
    var step = niceStep(maxV - minV);
    var top = Math.ceil(maxV / step) * step, bot = Math.floor(minV / step) * step;
    if (top === bot) top += step;
    var X = function (i) { return pl + i * (W - pl - pr) / (n - 1); };
    var Y = function (v) { return pt + (top - v) * (H - pt - pb) / (top - bot); };
    var svg = s('svg', { viewBox: '0 0 ' + W + ' ' + H, class: 'chart', role: 'img', 'aria-label': 'Evolução do saldo em conta e da reserva' });
    for (var v = bot; v <= top + 0.001; v += step) {
      svg.append(s('line', { x1: pl, x2: W - pr, y1: Y(v), y2: Y(v), class: Math.abs(v) < 0.01 ? 'zero' : 'grid' }));
      svg.append(s('text', { x: pl - 6, y: Y(v) + 3.5, 'text-anchor': 'end' }, tick(v)));
    }
    [0, 4, 8, 13].forEach(function (i) { svg.append(s('text', { x: X(i), y: H - 6, 'text-anchor': 'middle' }, chipLabel(months[i]))); });
    svg.append(s('line', { x1: X(sel), x2: X(sel), y1: pt, y2: H - pb, class: 'sel' }));
    var pts = function (k) { return months.map(function (x, i) { return X(i).toFixed(1) + ',' + Y(x[k]).toFixed(1); }).join(' '); };
    svg.append(s('polyline', { points: pts('saldo'), class: 'a' }));
    svg.append(s('polyline', { points: pts('reserva'), class: 'b' }));
    svg.append(s('circle', { cx: X(sel), cy: Y(m.saldo), r: 4.5, class: 'pa' }));
    svg.append(s('circle', { cx: X(sel), cy: Y(m.reserva), r: 4.5, class: 'pb' }));
    return h('section', { class: 'card' },
      h('h2', { text: 'Evolução de Saldo e Reserva (11/2026 a 12/2027)' }),
      svg,
      h('div', { class: 'legend' },
        h('span', { class: 'a' }, h('i'), 'Saldo em conta: ' + fmt(m.saldo)),
        h('span', { class: 'b' }, h('i'), 'Reserva: ' + fmt(m.reserva))),
      h('p', { class: 'note', text: 'O gráfico atualiza automaticamente sempre que você altera entradas, saídas ou aportes.' }));
  }

        chipLabel(m),
        m.saldo < 0 ? h('span', { class: 'dot', title: 'Saldo acumulado negativo' }) : null,
        isVac ? h('span', { class: 'dot-vac', title: 'Período de férias' }) : null
      ));
    });
  }

  function updateChips(scroll) {
    DATA.months.forEach(function (m, i) {
      var c = document.getElementById('chip-' + m.key);
      if (!c) return;
      if (i === sel) c.setAttribute('aria-current', 'true'); else c.removeAttribute('aria-current');
      if (i === sel && scroll) c.scrollIntoView({ inline: 'center', block: 'nearest' });
    });
  }

  function render() {
    rebuildChips();
    updateChips(false);
    var m = DATA.months[sel];
    var focusId = document.activeElement && document.activeElement.id;
    app.replaceChildren(
      hero(m, sel),
      alertsFor(m),
      payables(m),
      incomes(m, sel),
      workAndVacationCard(),
      reserve(m),
      chartCard(m),
      overview()
    );
    if (focusId && focusId.indexOf('chk-') === 0) {
      var f = document.getElementById(focusId);
      if (f) f.focus({ preventScroll: true });
    }
  }

  function select(i, setHash) {
    sel = i;
    render();
    updateChips(true);
    if (setHash) {
      try { history.replaceState(null, '', '#' + DATA.months[i].key); } catch (e) { location.hash = DATA.months[i].key; }
    }
  }

  /* Tema claro/escuro */
  var savedTheme = localStorage.getItem(THEME_KEY);
  if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
  document.getElementById('btn-theme').addEventListener('click', function () {
    var cur = document.documentElement.getAttribute('data-theme');
    var next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem(THEME_KEY, next);
  });

  /* Exportar Backup JSON */
  document.getElementById('btn-export').addEventListener('click', function () {
    var blob = new Blob([JSON.stringify({ data: DATA, paid: paid }, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'backup_financas_' + new Date().toISOString().slice(0, 10) + '.json';
    a.click();
  });

  /* Restaurar valores originais */
  document.getElementById('btn-reset').addEventListener('click', function () {
    if (confirm('Deseja restaurar todos os valores para a projeção padrão?')) {
      localStorage.removeItem(STORAGE_KEY);
      DATA = clone(DEFAULT_DATA);
      recalculateAll();
      render();
    }
  });

  /* Importar Backup JSON */
  var fileImport = document.getElementById('file-import');
  document.getElementById('btn-import').addEventListener('click', function () {
    fileImport.click();
  });
  fileImport.addEventListener('change', function (e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function (ev) {
      try {
        var parsed = JSON.parse(ev.target.result);
        if (parsed && parsed.data && Array.isArray(parsed.data.months)) {
          DATA = parsed.data;
          if (parsed.paid) { paid = parsed.paid; savePaid(); }
          recalculateAll();
          saveState();
          render();
          alert('Backup importado com sucesso!');
        } else {
          alert('Arquivo de backup inválido.');
        }
      } catch (err) {
        alert('Erro ao ler o arquivo JSON.');
      }
      fileImport.value = '';
    };
    reader.readAsText(file);
  });

  /* PWA: Service Worker & Botão Instalar App */
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.protocol === 'http:')) {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  }
  var deferredPrompt = null;
  var btnInstall = document.getElementById('btn-install');
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferredPrompt = e;
    btnInstall.style.display = 'inline-flex';
  });
  btnInstall.addEventListener('click', function () {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function () {
      deferredPrompt = null;
      btnInstall.style.display = 'none';
    });
  });

  function fromHash() {
    var k = location.hash.slice(1);
    return DATA.months.findIndex(function (m) { return m.key === k; });
  }

  var start = fromHash();
  if (start < 0) start = 0; // Abre diretamente em 11/2026 onde está a Despesa Pai
  window.addEventListener('hashchange', function () { var i = fromHash(); if (i >= 0 && i !== sel) select(i, false); });
  select(start, false);
})();
</script>
</body>
</html>
